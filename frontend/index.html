<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL QA Framework | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- SweetAlert2 para Notificaciones Profesionales -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background-color: #1a1d20; color: #fff; padding-top: 20px; position: fixed; width: 16.666667%; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #0d6efd; border-left: 4px solid #fff; }
        .main-content { margin-left: 16.666667%; padding: 2rem; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        .kpi-card { border-left: 4px solid #0d6efd; }
        .kpi-success { border-left: 4px solid #198754; }
        .kpi-warning { border-left: 4px solid #ffc107; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h5 class="text-center mb-4 text-white fw-bold"><i class="bi bi-database-check text-primary"></i> QA Framework</h5>
                <a href="#" class="active" onclick="mostrarSeccion('casos')"><i class="bi bi-code-square me-2"></i> Casos de Prueba</a>
                <a href="#" onclick="mostrarSeccion('suites')"><i class="bi bi-collection me-2"></i> Suites de Ejecución</a>
                <a href="#"><i class="bi bi-shield-check me-2"></i> Auditoría (Pronto)</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 text-dark fw-bold" id="titulo-seccion">Gestión de Casos</h2>
                    <span class="badge bg-primary px-3 py-2">Motor FastAPI: En línea</span>
                </div>

                <!-- KPIs ROW (Indicadores Gerenciales) -->
                <div class="row mb-4" id="kpi-row">
                    <div class="col-md-4">
                        <div class="card kpi-card p-3">
                            <h6 class="text-muted mb-1">Total Casos Registrados</h6>
                            <h3 class="fw-bold mb-0" id="kpi-total-casos">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card kpi-success p-3">
                            <h6 class="text-muted mb-1">Suites Activas</h6>
                            <h3 class="fw-bold mb-0" id="kpi-total-suites">1</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card kpi-warning p-3">
                            <h6 class="text-muted mb-1">Tasa de Ejecución Hoy</h6>
                            <h3 class="fw-bold mb-0">0%</h3>
                        </div>
                    </div>
                </div>

                <!-- Sección: Casos de Prueba -->
                <div id="seccion-casos" class="card">
                    <div class="card-header bg-white p-3 d-flex justify-content-between align-items-center border-bottom-0">
                        <h6 class="m-0 fw-bold text-secondary">Inventario DML</h6>
                        <div>
                            <button class="btn btn-primary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#modalNuevoCaso">
                                <i class="bi bi-plus-lg"></i> Nuevo Caso
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="cargarCasos()">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Detalle del Caso</th>
                                    <th>Sentencia DML (SQL)</th>
                                    <th>Expected</th>
                                    <th class="pe-4 text-end">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-casos"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Sección: Suites -->
                <div id="seccion-suites" class="card" style="display: none;">
                    <div class="card-body">
                        <div class="row" id="contenedor-suites"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: Crear Nuevo Caso de Prueba -->
    <div class="modal fade" id="modalNuevoCaso" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="bi bi-plus-square me-2"></i>Registrar Nuevo Caso DML</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formNuevoCaso" onsubmit="guardarNuevoCaso(event)">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Caso</label>
                            <input type="text" class="form-control" id="tc-name" placeholder="Ej: TC-002: Actualizar Salario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" id="tc-desc" rows="2" placeholder="Propósito de la prueba..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Query SQL (Objetivo)</label>
                            <textarea class="form-control text-primary font-monospace" id="tc-sql" rows="2" placeholder="UPDATE users SET..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Resultado Esperado (Filas afectadas)</label>
                            <input type="text" class="form-control" id="tc-expected" placeholder="Ej: 1" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar Caso</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS (Requerido para Modales) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
